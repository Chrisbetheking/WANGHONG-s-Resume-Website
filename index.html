<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WANG HONG | Portfolio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
  --text:#0f172a;
  --border:#e2e8f0;
}

body{
  margin:0;
  font-family:Inter,system-ui;
  background:var(--bg);
  color:var(--text);
}

.container{
  width:min(1100px,90%);
  margin:auto;
}

/* NAV */
.nav{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  background:white;
  border-radius:999px;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.nav a{
  text-decoration:none;
  margin-left:10px;
}

/* HERO */
.hero{
  padding:140px 0 80px;
  text-align:center;
}

h1{
  font-size:40px;
  margin-bottom:10px;
}

/* CARD */
.card{
  background:white;
  padding:28px;
  border-radius:18px;
  margin-top:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.05);
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
}

/* BUTTON */
.project-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:10px 14px;
  border-radius:10px;
  background:#eef2ff;
  margin-right:10px;
  text-decoration:none;
}

/* FLOW */
.flow-toggle{
  margin-top:16px;
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}

.flow-panel{
  display:none;
  margin-top:10px;
}

.flow-panel.show{
  display:block;
}

.project-img{
  width:100%;
  border-radius:12px;
}

/* MOBILE */
@media(max-width:720px){
  h1{font-size:28px;}
  .hero{padding-top:120px;}
  .project-link{width:100%;margin-top:10px;justify-content:center;}
}
</style>
</head>

<body>

<div class="nav">
  <strong>WANG HONG</strong>
  <div>
    <a href="#projects">项目</a>
  </div>
</div>

<section class="hero">
  <div class="container">
    <h1>AI + Software Developer</h1>
    <p>Java / AI Agent / Web Demo</p>
  </div>
</section>

<section id="projects" class="container">

<!-- JAVA -->
<div class="card">
  <h2>Java Student Management System</h2>

  <a href="https://chrisbetheking.github.io/java-student-management-system/" target="_blank" class="project-link">
    🚀 Web Demo
  </a>

  <a href="https://github.com/Chrisbetheking/java-student-management-system" target="_blank" class="project-link">
    💻 Source Code
  </a>

  <p>Java Swing + Web Demo 可运行项目</p>
</div>

<!-- AI 1 -->
<div class="card">
  <h2>AI Agent 企业系统</h2>

  <button class="flow-toggle" onclick="toggleFlow(this)">
    <span>展开流程图</span>
    <i class="fa-solid fa-chevron-down"></i>
  </button>

  <div class="flow-panel">
    <img src="ai-agent-enterprise-architecture.png" class="project-img">
  </div>

  <p>企业级 AI Agent 系统设计</p>
</div>

<!-- AI 2 -->
<div class="card">
  <h2>AI 医疗问答系统</h2>

  <button class="flow-toggle" onclick="toggleFlow(this)">
    <span>展开流程图</span>
    <i class="fa-solid fa-chevron-down"></i>
  </button>

  <div class="flow-panel">
    <img src="medical-ai-workflow.png" class="project-img">
  </div>

  <p>RAG + 医疗问答流程系统</p>
</div>

</section>

<script>
function toggleFlow(btn){
  const panel = btn.nextElementSibling;
  panel.classList.toggle("show");

  const text = btn.querySelector("span");
  text.textContent = panel.classList.contains("show") ? "收起流程图" : "展开流程图";
}
</script>

</body>
</html>
