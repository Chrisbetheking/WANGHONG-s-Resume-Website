<html lang="zh-CN">
<head>

  <meta name="description" content="王鸿的个人作品集，展示 AI Agent、前端工程、医疗健康信息检索、Flutter 校园交通系统、Java 学生成绩管理系统与交互式网页项目。" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b18;
      --bg-2: #10182f;
      --card: rgba(255, 255, 255, 0.075);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f7fbff;
      --muted: #b7c4e6;
      --soft: #dce8ff;
      --blue: #7db7ff;
      --cyan: #76ffe0;
      --pink: #ff8ebc;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 8%, rgba(125, 183, 255, 0.2), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(255, 142, 188, 0.17), transparent 28%),
        radial-gradient(circle at 50% 92%, rgba(118, 255, 224, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: 0.16;
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(7, 11, 24, 0.76);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), var(--pink));
      display: grid;
      place-items: center;
      color: #07101f;
      font-weight: 1000;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      padding: 9px 12px;
      border-radius: 999px;
      transition: 0.22s ease;
    }

    .nav-links a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.09);
    }

    .hero {
      min-height: calc(100vh - 80px);
      display: grid;
      grid-template-columns: 1.1fr 0.8fr;
      align-items: center;
      gap: 36px;
      padding: 72px 0 46px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .badge,
    .tag {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.09);
      color: var(--soft);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .hero h1 {
      font-size: clamp(64px, 9vw, 106px);
      line-height: 0.95;
      letter-spacing: -4px;
      margin-bottom: 18px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #ffffff, var(--blue), var(--cyan), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero h2 {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.18;
      margin-bottom: 20px;
      letter-spacing: -1.5px;
    }

    .lead {
      max-width: 780px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.9;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      transition: 0.22s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.2);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #07101f;
      border: none;
    }

    .btn.pink {
      background: linear-gradient(135deg, var(--pink), #ffd3e5);
      color: #07101f;
      border: none;
    }

    .btn.dark {
      background: rgba(255, 255, 255, 0.06);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.075);
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .profile-card {
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.07));
      border-radius: 30px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 34px;
      overflow: hidden;
      margin: 0 auto 24px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-card h3 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .profile-card p {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 16px;
    }

    .profile-list {
      display: grid;
      gap: 10px;
    }

    .profile-item {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      color: var(--soft);
      line-height: 1.65;
    }

    section {
      padding: 66px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--cyan);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: -1.5px;
      margin-bottom: 10px;
    }

    .section-desc {
      color: var(--muted);
      max-width: 760px;
      line-height: 1.8;
    }
